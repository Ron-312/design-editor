name: installers
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      # The app bundles all of src/, so any source change can break the packaged app.
      - 'src/**'
      - 'desktop/**'
      - 'electron-builder.yml'
      - 'scripts/build-app.mjs'
      - 'scripts/smoke-app.mjs'
      - 'scripts/electron-suite.mjs'
      - '.github/workflows/installers.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
            unpacked: release/win-unpacked
            exe: win-unpacked/Design Editor.exe
            files: release/*.exe
          - os: macos-latest
            dist: dist:mac
            unpacked: release/mac-arm64/Design Editor.app
            exe: Design Editor.app/Contents/MacOS/Design Editor
            files: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.dist }}
      - name: Pull the sample canvas the way /design-pull does
        shell: bash
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          npm run -s edsync -- ingest --slug sample --remote-dir test/fixtures/canvas
          npm run -s edsync -- cache --slug sample --from test/fixtures/canvas/fetched --release sample
      # Inside the repo, Node would find the repo's node_modules and hide a dependency the app does not ship.
      - name: Copy the packaged app out of the repo, as an install puts it
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/installed"
          cp -R "${{ matrix.unpacked }}" "$RUNNER_TEMP/installed/"
      - name: Launch the packaged app on it
        shell: bash
        run: node scripts/smoke-app.mjs "$RUNNER_TEMP/installed/${{ matrix.exe }}" "$PWD/projects/sample" app-${{ matrix.os }}.png
      - name: Drive the packaged app through its Edit menu
        shell: bash
        run: node scripts/electron-suite.mjs "$RUNNER_TEMP/installed/${{ matrix.exe }}" "$PWD/projects/sample"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            ${{ matrix.files }}
            app-${{ matrix.os }}.png
          retention-days: 14

  # A v* tag publishes the tested installers; any other push only keeps them as CI artifacts.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Install

          - **macOS:** open the `.dmg` for your Mac (`arm64` for Apple silicon, `x64` for Intel) and drag Design Editor to Applications. The app is not notarized yet, so the first time, right-click it and choose **Open**.
          - **Windows:** run the `win-x64.exe` installer. Windows SmartScreen may warn about an unknown publisher; choose **More info → Run anyway**.

          Then open a canvas folder made by `/design-pull` in Claude Code.
          NOTES
          # upload-artifact keeps each file's path, so the installers sit under installers/release/.
          gh release create "${GITHUB_REF_NAME}" installers/release/*.dmg installers/release/*.exe \
            --title "Design Editor ${GITHUB_REF_NAME}" --notes-file notes.md --generate-notes --verify-tag

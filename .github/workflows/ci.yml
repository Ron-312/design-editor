name: ci
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces its running checks; every run on main finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # autocrlf=true is Git for Windows' default, so only Windows runs with it.
        include:
          - os: windows-latest
            autocrlf: 'true'
          - os: macos-latest
            autocrlf: 'false'
    runs-on: ${{ matrix.os }}
    steps:
      # Set before checkout so the checkout itself reproduces a Git for Windows autocrlf=true user.
      - run: git config --global core.autocrlf ${{ matrix.autocrlf }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm run build
      # Pull requests run only a few specs in Edge (see playwright.config.ts); main runs every spec there too.
      - run: npm run e2e
        env:
          E2E_EDGE: ${{ github.event_name == 'push' && 'full' || 'smoke' }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.os }}-autocrlf-${{ matrix.autocrlf }}
          path: test-results/
          retention-days: 7

name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        autocrlf: ['false', 'true']
    runs-on: ${{ matrix.os }}
    steps:
      # Set before checkout so the checkout itself reproduces a Git for Windows autocrlf=true user.
      - run: git config --global core.autocrlf ${{ matrix.autocrlf }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run e2e
